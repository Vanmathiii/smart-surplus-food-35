<!DOCTYPE html>
<html>
<head>
    <title>Donate Food</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h2>🍛 Donate Surplus Food</h2>

    <form method="POST">

        <input
            type="text"
            name="food_name"
            placeholder="Food Name"
            required
        >

        <input
            type="text"
            name="quantity"
            placeholder="Quantity (e.g. 20 meals)"
            required
        >

        <input
            type="text"
            name="location"
            placeholder="Location"
            required
        >

        <button type="submit">
            Add Food
        </button>

    </form>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
